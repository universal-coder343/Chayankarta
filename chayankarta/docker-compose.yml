# ─────────────────────────────────────────────────────────────────────────────
# Chayankarta — Docker Compose (local development)
#
# Usage:  docker compose up --build
# Prod:   Deploy to Railway (see DEPLOY.md)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chayankarta-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - WEIGHT_SEMANTIC=0.40
      - WEIGHT_SKILL=0.35
      - WEIGHT_EXPERIENCE=0.15
      - WEIGHT_EDUCATION=0.10
      - ENABLE_REDACTION=true
      - REDACT_INSTITUTIONS=false
      - TRANSFORMERS_OFFLINE=1
      - HF_DATASETS_OFFLINE=1
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
      - hf_cache:/root/.cache/huggingface
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (production build + nginx) ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chayankarta-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BACKEND_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  # ── MongoDB ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: chayankarta-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  upload_data:
  hf_cache:      # persistent HuggingFace model cache (avoids re-download)
